plugins {
    alias(libs.plugins.android.application)
}

android {

    namespace 'com.revc.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.revc.game"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.0.2"

        ndkVersion '27.2.12479018'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        // Name of the game-files folder under internal storage (Environment.
        // getExternalStorageDirectory()), read by GameActivity.GAME_FOLDER_NAME.
        buildConfigField "String", "GAME_FOLDER_NAME", "\"reVC\""
    }

    // Separate mod "editions": each one is its own installable app (own
    // applicationId, so it installs side by side with the standard one
    // instead of replacing it) pointed at its own folder under internal
    // storage, so a mod's files never have to be mixed into -- or overwrite
    // anything in -- the same folder as an unmodified install.
    flavorDimensions = ["edition"]
    productFlavors {
        standard {
            dimension "edition"
            // Inherits applicationId/GAME_FOLDER_NAME from defaultConfig as-is.
        }
        longnight {
            dimension "edition"
            applicationIdSuffix ".longnight"
            versionNameSuffix "-longnight"
            buildConfigField "String", "GAME_FOLDER_NAME", "\"reVC-LongNight\""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug

            externalNativeBuild {
                cmake {
                    cppFlags '-O3', '-fvisibility=hidden'
                }
            }

            debuggable false
            minifyEnabled true
            shrinkResources true
            jniDebuggable false
            renderscriptDebuggable false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug

            externalNativeBuild {
                cmake {
                    cppFlags '-g', '-DDEBUG'
                }
            }

            debuggable true
            minifyEnabled false
            jniDebuggable true
            renderscriptDebuggable true
        }
    }

    packagingOptions {
        jniLibs.excludes += ['META-INF/*']
        resources.excludes += ['META-INF/*']
        // jniDebuggable alone still lets AGP strip DWARF line info on some
        // versions -- force-keep full debug symbols so addr2line can resolve
        // exact source lines from a device tombstone, not just function names.
        jniLibs.keepDebugSymbols += ['**/*.so']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
    }

    sourceSets {
        main {
            jniLibs.srcDir 'jniLibs'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}